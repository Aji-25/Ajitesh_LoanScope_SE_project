[project]
name = "loanscope-backend"
version = "0.1.0"
description = "API foundation for the LoanScope requirement engineering workspace"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0,<2.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "google-genai>=1.0.0,<2.0.0",
  "httpx>=0.28.0,<1.0.0",
  "langgraph>=0.6.0,<2.0.0",
  "langgraph-checkpoint-postgres>=2.0.0,<4.0.0",
  "openai>=1.100.0,<3.0.0",
  "pgvector>=0.4.0,<1.0.0",
  "pwdlib[argon2]>=0.3.0,<1.0.0",
  "pyjwt>=2.10.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "psycopg[binary,pool]>=3.2.0,<4.0.0",
  "pypdf>=6.0.0,<7.0.0",
  "python-docx>=1.2.0,<2.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
  "uvicorn[standard]>=0.34.0,<1.0.0",
  "reportlab>=4,<5",
]

[dependency-groups]
dev = [
  "mypy>=1.17.0,<2.0.0",
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
  "ruff>=0.12.0,<1.0.0",
  "types-reportlab>=5.1.0.20261122",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
